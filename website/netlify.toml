# Netlify config for the Continuum landing page.
# Deploy options:
#   1. Drag-and-drop: drop this `website/` folder onto https://app.netlify.com/drop
#   2. Git: connect the repo, set Base directory = "website", Publish directory = "website"
# It is a pure static site, so there is no build command.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
